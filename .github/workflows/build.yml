name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pynput pystray pillow pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name MicButtonRemap --icon=NONE mic_button_remap.py

      - name: Bundle with config
        run: |
          copy config.json dist\config.json
          copy install_windows.bat dist\install_windows.bat

      - uses: actions/upload-artifact@v4
        with:
          name: MicButtonRemap-Windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pynput pystray pillow pyinstaller

      - name: Build .app
        run: |
          pyinstaller --onefile --windowed --name MicButtonRemap mic_button_remap.py

      - name: Bundle with config
        run: |
          cp config.json dist/config.json
          cp install_mac.command dist/install_mac.command

      - uses: actions/upload-artifact@v4
        with:
          name: MicButtonRemap-macOS
          path: dist/

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create ZIP archives
        run: |
          cd artifacts/MicButtonRemap-Windows && zip -r ../../MicButtonRemap-Windows.zip . && cd ../..
          cd artifacts/MicButtonRemap-macOS && zip -r ../../MicButtonRemap-macOS.zip . && cd ../..

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MicButtonRemap-Windows.zip
            MicButtonRemap-macOS.zip
          generate_release_notes: true
